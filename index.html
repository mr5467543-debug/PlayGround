<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b080c" />
  <meta name="description" content="Echoes of the 100th Floor — a hardcore turn-based tactical roguelike where death leaves a legacy." />
  <title>Echoes of the 100th Floor</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>
  <div id="app" class="app" data-theme="threshold">
    <div id="screen" class="screen">
      <div class="boot">
        <div class="boot-sigil" aria-hidden="true">✦</div>
        <h1 class="boot-title">Echoes of the<br />100th Floor</h1>
        <p class="boot-sub">The dungeon remembers.</p>
        <div class="boot-loader"><span></span></div>
      </div>
    </div>
  </div>
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
